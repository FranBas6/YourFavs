[build]
  command = "npm run build"
  publish = "dist"

# Node 22: @supabase/supabase-js ya no arranca en Node 20 (sin WebSocket nativo), y 20 está fuera
# de soporte desde abril de 2026. Las funciones de Netlify usan la versión del build.
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Aumentar timeout para páginas con muchas llamadas a APIs externas
[functions."*"]
  max_duration = 60

# Configuración de headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    
# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker NO se cachea. Si el CDN sirviera una copia vieja, los móviles se quedarían
# con la versión antigua de las reglas de caché hasta que al navegador le diera por revisarlo.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El manifest cambia poquísimo, pero cuando cambia (un icono nuevo) interesa que llegue.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# La caché de las páginas (portada, catálogo, fichas de peli/serie/actor) YA NO SE DECIDE AQUÍ.
#
# Motivo: una regla por ruta no puede saber si hay sesión, y todas esas páginas son personalizadas
# cuando la hay (la portada lleva tu nombre y tu «Estás viendo»; las fichas, en qué listas tienes el
# título, tu nota y tu progreso). El `for = "/"` con `public, s-maxage=300` que había aquí hacía la
# portada personalizada cacheable por el CDN COMPARTIDO de Netlify, y la regla que debía evitarlo
# apuntaba a `/personal/*`, ruta que dejó de existir al renombrar a `/mislistas/*`.
#
# Ahora lo decide `src/middleware.ts::applyCacheHeaders`, que es el único sitio que sabe si hay
# sesión: invitado → los mismos 5 min de CDN de antes (con `Vary: Cookie`), con sesión →
# `private, no-store`. Se deja fuera de aquí a propósito para no tener dos fuentes de verdad.

# Las páginas personales NO se cachean (datos del usuario). Redundante con el middleware, pero es
# el cinturón por si algún día se sirven sin pasar por él.
[[headers]]
  for = "/mislistas/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store"

[[headers]]
  for = "/perfil/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store"
